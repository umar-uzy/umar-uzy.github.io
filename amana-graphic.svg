<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="700" height="380" fill="#f7f8f6" stroke="#cdd3ce" stroke-width="1.5"/>

  <!-- bank building: pediment + columns + base, minimal line art -->
  <g stroke="#1f2622" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- roofline / pediment -->
    <path d="M 190 140 L 350 80 L 510 140" />
    <!-- entablature line -->
    <line x1="185" y1="140" x2="515" y2="140" />
    <!-- columns -->
    <line x1="220" y1="150" x2="220" y2="250" />
    <line x1="280" y1="150" x2="280" y2="250" />
    <line x1="350" y1="150" x2="350" y2="250" />
    <line x1="420" y1="150" x2="420" y2="250" />
    <line x1="480" y1="150" x2="480" y2="250" />
    <!-- base step -->
    <line x1="170" y1="250" x2="530" y2="250" />
    <line x1="155" y1="262" x2="545" y2="262" />
  </g>

  <!-- ledger / reconciliation line beneath the building -->
  <g stroke="#4b544e" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="120" y1="300" x2="580" y2="300" />
  </g>

  <!-- balanced stamp badge -->
  <g transform="translate(350,300)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#3c7a5d" stroke-width="2" transform="rotate(-6)"/>
    <path d="M -11 0 L -3 8 L 12 -9" fill="none" stroke="#3c7a5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6)"/>
  </g>

  <!-- caption, mono style like site chapter labels -->
  <text x="350" y="350" text-anchor="middle" font-family="Courier New, monospace" font-size="13" letter-spacing="2" fill="#4b544e">AMĀNA BANK · 2016 – 2021</text>
</svg>
